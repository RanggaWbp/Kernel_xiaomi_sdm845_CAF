name: BakaSU Kernel Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # Manual trigger button in GitHub Actions

env:
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      HOSTCC: gcc
      HOSTCXX: g++
      CC: ${{ github.workspace }}/tc/clang/bin/clang
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: ${{ github.workspace }}/tc/gcc-64/bin/aarch64-linux-android-
      CROSS_COMPILE_ARM32: ${{ github.workspace }}/tc/gcc-32/bin/arm-linux-androideabi-
    strategy:
      matrix:
        defconfig:
          - beryllium
          - dipper
          - equuleus
          - perseus
          - polaris
          - ursa
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make libncurses-dev qemu-utils
          export PATH="$GITHUB_WORKSPACE/tc/gcc-64/bin:$GITHUB_WORKSPACE/tc/gcc-32/bin:/usr/bin:/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC="$GITHUB_WORKSPACE/tc/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GITHUB_WORKSPACE/tc/gcc-64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/tc/gcc-32/bin/arm-linux-androideabi-"

      - name: Pull submodules
        run: git submodule update --init --recursive

      - name: Generate build metadata
        run: |
          KERNEL_VERSION=$(make kernelversion 2>/dev/null || echo unknown)
          KERNEL_RELEASE=$(make kernelrelease 2>/dev/null || echo unknown)
          if [ -d "BakaSU" ]; then
            KASU_VERSION=$(cd BakaSU && git describe --tags 2>/dev/null || git rev-parse --short HEAD)
          else
            KASU_VERSION=none
          fi
          if [ -f "include/linux/susfs.h" ]; then
            SUSFS_VERSION=$(grep -oP '(?<=SUSFS_VERSION\s")[^"]+' include/linux/susfs.h)
          else
            SUSFS_VERSION=unknown
          fi
          BUILD_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          printf 'KERNEL_VERSION=%s\nKERNEL_RELEASE=%s\nKASU_VERSION=%s\nSUSFS_VERSION=%s\nBUILD_TIMESTAMP=%s\n' \
            "$KERNEL_VERSION" "$KERNEL_RELEASE" "$KASU_VERSION" "$SUSFS_VERSION" "$BUILD_TIMESTAMP" \
            > build.env

      - name: Configure kernel
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} ${DEFCONFIG}

      - name: Compile kernel
        run: |
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} -j$(nproc) Image.gz-dtb
          source build.env
          echo "## Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- Kernel: `${KERNEL_VERSION}`" >> $GITHUB_STEP_SUMMARY
          echo "- Release: `${KERNEL_RELEASE}`" >> $GITHUB_STEP_SUMMARY
          echo "- BakaSU: `${KASU_VERSION}`" >> $GITHUB_STEP_SUMMARY
          echo "- SUSFS: `${SUSFS_VERSION}`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: `${BRANCH}`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: [#${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})" >> $GITHUB_STEP_SUMMARY

      - name: Package with AnyKernel3
        run: |
          mkdir -p ak3
          cp anykernel/anykernel.sh ak3/
          source build.env
          sed -i "s|^kernel\.string=.*|kernel.string=BakaSU for Xiaomi SDM845 by RanggaWbp|" ak3/anykernel.sh
          sed -i "s|BakaSU v[0-9.]\+ + SUSFS v[0-9.]\+|BakaSU ${KASU_VERSION} + SUSFS ${SUSFS_VERSION}|g" ak3/anykernel.sh
          cd ak3 && bash ak3-core.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip-${RUN_ID}
          path: ak3/*.zip
