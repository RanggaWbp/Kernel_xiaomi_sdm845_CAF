name: BakaSU

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (empty = auto: v<run_number>-<DDMMYYYY>)"
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: bakasu-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_REPO: https://github.com/kdrag0n/proton-clang
  GCC_64_SOURCE: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
  GCC_64_BRANCH: android12L-release
  GCC_64_MIRROR: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
  GCC_64_MIRROR_BRANCH: lineage-19.1
  GCC_32_SOURCE: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
  GCC_32_BRANCH: android12L-release
  GCC_32_MIRROR: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
  GCC_32_MIRROR_BRANCH: lineage-19.1
  AK3_SOURCE: https://github.com/osm0sis/AnyKernel3.git
  # AnyKernel3 is pinned to an exact commit, NOT cloned at HEAD.
  #
  # It has no releases or tags, so "clone --depth 1" silently means
  # "whatever master happens to be today", and the flash toolchain then
  # changes without anyone touching this repo.  That already happened
  # once: upstream bb45b02 (2026-10-27 01:14 UTC) rewrote split_boot()'s
  # exit-code handling as `[ $? == 1 ] && splitfail=1;`, and because a
  # failing `[` test leaves $? == 1, the next line's
  # `if [ $? != 0 -o "$splitfail" ]` read that leftover 1 and aborted
  # with "Splitting image failed. Aborting..." on EVERY flash, including
  # a successful unpack.  v199 shipped it; v198, built hours earlier,
  # did not.
  #
  # c072981 is the last commit before that change, and is the exact
  # toolchain v198 was built and flashed with.
  #
  # The gate further down asserts the safe form is still present, so
  # unpinning cannot reintroduce this silently.
  AK3_COMMIT: c072981
  KERNEL_ARCH: arm64
  # clang is the actual compiler; the AOSP GCC 4.9 prebuilt only supplies
  # binutils (ld/ar/nm). Without CC set, kbuild looks for a gcc driver the
  # prebuilt does not ship and dies with "aarch64-linux-android-gcc: No such
  # file or directory". CLANG_TRIPLE must be the GNU triple, not a bare one.
  CC: ${{ github.workspace }}/tc/proton-clang/bin/clang
  CLANG_TRIPLE: aarch64-linux-gnu-
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  RUN_ID: ${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.model }} (${{ matrix.device }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: beryllium
            model: POCOPHONE F1
            defconfig: beryllium_defconfig
          - device: dipper
            model: Xiaomi Mi 8
            defconfig: dipper_defconfig
          - device: equuleus
            model: Xiaomi Mi 8 Pro (UD)
            defconfig: equuleus_defconfig
          - device: perseus
            model: Xiaomi MIX 3
            defconfig: perseus_defconfig
          - device: polaris
            model: Xiaomi MIX 2S
            defconfig: polaris_defconfig
          - device: ursa
            model: Xiaomi Mi 8 Explorer Edition
            defconfig: ursa_defconfig

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: false

      - name: Install build deps
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y bc bison build-essential ccache cpio curl flex \
            git libssl-dev libelf-dev make python3 rsync zip zstd

      - name: Free disk space
        run: |
          sudo -S -p '' rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Apply 4.9 backport patches
        run: |
          set -eu
          apply_if_needed() {
            p="$1"; d="${2:-.}"
            if git -C "$d" apply --check -R "$p" 2>/dev/null; then
              echo "already applied: $p"
            else
              git -C "$d" apply -v "$p"
            fi
          }
          apply_if_needed patches/backport/0002-rekernel-linux-4.9-cgroup-task-frozen.patch .

      - name: Fetch toolchains
        run: |
          set -eu
          # ProtonClang (64-bit)
          if [ ! -d "tc/proton-clang" ]; then
            git clone --depth 1 "$CLANG_REPO" tc/proton-clang
          fi
          # AOSP GCC 4.9 (64-bit); fall back to the LineageOS mirror when
          # android.googlesource.com answers 503
          if [ ! -d "tc/gcc-64" ]; then
            git clone --depth 1 --branch "$GCC_64_BRANCH" "$GCC_64_SOURCE" tc/gcc-64 \
              || { rm -rf tc/gcc-64; \
                   git clone --depth 1 --branch "$GCC_64_MIRROR_BRANCH" "$GCC_64_MIRROR" tc/gcc-64; }
          fi
          # AOSP GCC 4.9 (32-bit); same fallback
          if [ ! -d "tc/gcc-32" ]; then
            git clone --depth 1 --branch "$GCC_32_BRANCH" "$GCC_32_SOURCE" tc/gcc-32 \
              || { rm -rf tc/gcc-32; \
                   git clone --depth 1 --branch "$GCC_32_MIRROR_BRANCH" "$GCC_32_MIRROR" tc/gcc-32; }
          fi
          # Both gcc bin dirs must be on PATH. arch/arm64/Makefile derives
          # GCC_TOOLCHAIN{,_32}_DIR with `which $(CROSS_COMPILE_ARM32)ld`; if
          # it is not found, CLANG_PREFIX32 stays empty and clang's
          # -no-integrated-as falls back to ProtonClang's as, which rejects
          # the GNU '-EL' flag. Put them on PATH for every later step.
          echo "$PWD/tc/gcc-64/bin" >> "$GITHUB_PATH"
          echo "$PWD/tc/gcc-32/bin" >> "$GITHUB_PATH"

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: tc/
          key: toolchains-${{ runner.os }}-${{ hashFiles('tc/*/version') }}
          restore-keys: |
            toolchains-${{ runner.os }}-

      - name: Prepare kernel source
        run: |
          # Submodules are already initialized by actions/checkout
          # (submodules: recursive). Do NOT rm -rf .git/modules here: it
          # orphans every submodule gitfile and breaks this update step.
          git submodule update --init --recursive
          # Ensure we're on the right branch for patches
          git checkout "$BRANCH" || git checkout -b "$BRANCH"
          # Pull latest changes for current branch
          git pull origin "$BRANCH" --ff-only || true

      - name: Apply ReKernel patches
        run: |
          set -eu
          apply_if_needed() {
            p="$1"; d="${2:-.}"
            if git -C "$d" apply --check -R "$p" 2>/dev/null; then
              echo "already applied: $p"
            else
              git -C "$d" apply -v "$p"
            fi
          }
          if [ -d "ReKernel" ]; then
            echo "Applying ReKernel patches..."
            for patch in ReKernel/patches/*.patch; do
              apply_if_needed "$patch" .
            done
          else
            echo "ReKernel submodule not found, skipping patches"
          fi

      - name: Prepare output directories
        run: |
          mkdir -p out/{Image.gz,Image.gz-dtb,img}
          mkdir -p artifacts/{zip,logs}

      - name: Configure kernel
        run: |
          make ARCH=$KERNEL_ARCH CC="$PWD/tc/proton-clang/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE="$PWD/tc/gcc-64/bin/aarch64-linux-android-" CROSS_COMPILE_ARM32="$PWD/tc/gcc-32/bin/arm-linux-androideabi-" O=out ${{ matrix.defconfig }}
          # Enable extra configs for better Android compatibility
          sed -i 's/# CONFIG_LOCALVERSION_AUTO is not set/CONFIG_LOCALVERSION_AUTO=y/' out/.config
          sed -i 's/# CONFIG_LOCALVERSION is not set/CONFIG_LOCALVERSION="-bakasu-susfs"/' out/.config
          # Ensure key features are enabled
          grep -q 'CONFIG_KSU=y' out/.config || echo 'CONFIG_KSU=y' >> out/.config
          grep -q 'CONFIG_SUSFS=y' out/.config || echo 'CONFIG_SUSFS=y' >> out/.config
          grep -q 'CONFIG_NO_MOUNT=y' out/.config || echo 'CONFIG_NO_MOUNT=y' >> out/.config
          grep -q 'CONFIG_NTSYNC=y' out/.config || echo 'CONFIG_NTSYNC=y' >> out/.config
          grep -q 'CONFIG_SCHED_BORE=y' out/.config || echo 'CONFIG_SCHED_BORE=y' >> out/.config
          grep -q 'CONFIG_IOSCHED_ADIOS=y' out/.config || echo 'CONFIG_IOSCHED_ADIOS=y' >> out/.config
          grep -q 'CONFIG_LRU_GEN=y' out/.config || echo 'CONFIG_LRU_GEN=y' >> out/.config
          grep -q 'CONFIG_CRYPTO_LZ4=y' out/.config || echo 'CONFIG_CRYPTO_LZ4=y' >> out/.config
          # LZ4KD is built in so the "lz4kdr" crypto algorithm is registered
          # and shows up in /sys/block/zram0/comp_algorithm. It is NOT the
          # default compressor -- LZ4 stays default, LZ4KD is selected by
          # hand from Franco Kernel Manager.
          grep -q 'CONFIG_CRYPTO_LZ4KDR=y' out/.config || echo 'CONFIG_CRYPTO_LZ4KDR=y' >> out/.config
          # BBRv3 must be BUILT IN (=y, not =m): the AK3 zip ships only
          # Image.gz-dtb, so a .ko would never reach the device. TCP_CONG_BBR3
          # lives inside `if TCP_CONG_ADVANCED`, so that must be on too.
          grep -q 'CONFIG_TCP_CONG_ADVANCED=y' out/.config || echo 'CONFIG_TCP_CONG_ADVANCED=y' >> out/.config
          grep -q 'CONFIG_TCP_CONG_BBR3=y' out/.config || echo 'CONFIG_TCP_CONG_BBR3=y' >> out/.config
          # Make bbr3 the system-wide default CC (CONFIG_DEFAULT_TCP_CONG
          # derives from the DEFAULT_* choice, so without this the image ships
          # bbr3 compiled-in but still running cubic).
          grep -q 'CONFIG_DEFAULT_BBR3=y' out/.config || echo 'CONFIG_DEFAULT_BBR3=y' >> out/.config

      - name: Validate critical config symbols
        run: |
          set -eu
          echo "Validating kernel configuration..."
          # Check for symbols that must be present
          failures=0
          check_symbol() {
            local sym="$1"
            local val="$2"
            if ! grep -q "^${sym}=${val}$" out/.config; then
              echo "ERROR: ${sym}=${val} not found in config"
              failures=$((failures + 1))
            else
              echo "OK: ${sym}=${val}"
            fi
          }
          check_symbol "CONFIG_ARM64" "y"
          check_symbol "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE" "y"
          check_symbol "CONFIG_DEBUG_INFO" "y"
          check_symbol "CONFIG_INITRAMFS_SOURCE" '""'
          check_symbol "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE" "y"
          check_symbol "CONFIG_NTSYNC" "y"
          check_symbol "CONFIG_LRU_GEN" "y"
          check_symbol "CONFIG_CRYPTO_LZ4" "y"
          check_symbol "CONFIG_LZ4_COMPRESS" "y"
          check_symbol "CONFIG_LZ4_DECOMPRESS" "y"
          check_symbol "CONFIG_CRYPTO_LZ4KDR" "y"
          check_symbol "CONFIG_LZ4KDR_COMPRESS" "y"
          check_symbol "CONFIG_LZ4KDR_DECOMPRESS" "y"
          check_symbol "CONFIG_ZRAM" "y"
          check_symbol "CONFIG_TCP_CONG_ADVANCED" "y"
          check_symbol "CONFIG_TCP_CONG_BBR3" "y"
          check_symbol "CONFIG_DEFAULT_BBR3" "y"
          check_symbol "CONFIG_DEFAULT_TCP_CONG" '"bbr3"'
          # Backported scheduler / cpufreq features: a symbol silently dropped
          # by a Kconfig dependency miss still leaves =y in .config, so the
          # object check below is what proves it actually compiled in.
          check_symbol "CONFIG_SCHED_POC_SELECTOR" "y"
          check_symbol "CONFIG_CPU_FREQ_GOV_REFLEX" "y"
          check_symbol "CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX" "y"
          # ADIOS must be the *default* scheduler, not merely built: without
          # CONFIG_DEFAULT_ADIOS the "Default I/O scheduler" choice still
          # resolves to CFQ and adios-iosched.o is dead code in the image.
          check_symbol "CONFIG_IOSCHED_ADIOS" "y"
          check_symbol "CONFIG_DEFAULT_ADIOS" "y"
          if [ $failures -gt 0 ]; then
            echo "Config validation failed with $failures errors"
            exit 1
          fi
          echo "Config validation passed"

      - name: Build kernel Image.gz
        run: |
          set -o pipefail
          # BakaSU main ships a "module preinit" runner (kernel/preinit/runner,
          # a vendored nolibc binary that preinit/blob.S .incbins into
          # .init.rodata). Its makefile,
          # kernel/tools/code_generation/preinit_runner/preinit_runner.mk,
          # says outright that it is meant for GKI kernels: "built against the
          # installed UAPI headers of the target kernel (CONFIG_HEADERS_INSTALL,
          # enabled by gki_defconfig)". On this 4.9 CAF tree its gate passes by
          # accident and the build then dies:
          #   aarch64-linux-android-ld: drivers/kernelsu/preinit/runner.elf.o:
          #       Relocations in generic ELF (EM: 62)
          #   blob.S:10: Error: file not found: .../out/drivers/kernelsu/preinit/runner.elf
          # The feature cannot be turned off from this tree any other way: its
          # own fallback branch (the `else` of the UAPI header check) is what
          # both drops preinit/{preinit,blob}.o from kernelsu-objs and defines
          # KSU_NO_PREINIT, and defining KSU_NO_PREINIT alone leaves preinit.c
          # compiled, where it redefines ksu_preinit_init() against the
          # header's static inline. Reaching that fallback needs
          # $(objtree)/usr/include/linux/unistd.h to be absent, so we make
          # out/usr/include a file: the gate's wildcard then matches nothing,
          # the nested headers_install cannot create the directory, and
          # upstream takes its own documented path. out/usr itself must be a
          # real directory, because usr/Makefile builds gen_init_cpio and
          # initramfs_data.o there -- and it does not exist yet at this point,
          # since only the kernel build creates it, so it has to be made
          # first. A bare `: > out/usr/include` fails with "No such file or
          # directory" and kills the step before make ever runs.
          mkdir -p out/usr && : > out/usr/include
          # Capture build stdout: BakaSU kernel/Kbuild prints its own version
          # banner via $(info ...). Grep that instead of recomputing from the
          # submodule, so Kbuild stays the single source of truth.
          make -j$(nproc) ARCH=$KERNEL_ARCH CC="$PWD/tc/proton-clang/bin/clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE="$PWD/tc/gcc-64/bin/aarch64-linux-android-" CROSS_COMPILE_ARM32="$PWD/tc/gcc-32/bin/arm-linux-androideabi-" O=out Image.gz 2>&1 | tee build-${{ matrix.device }}.log
          cp out/arch/arm64/boot/Image.gz out/Image.gz/
          # Prove the preinit fallback actually ran, instead of assuming it.
          # Upstream prints this itself; if it is gone the gate changed and
          # this line must be re-derived, not left passing silently.
          grep -q 'preinit disabled' build-${{ matrix.device }}.log || { echo 'ERROR: BakaSU preinit fallback did not run'; exit 1; }
          # And prove nothing from the runner leaked into the image.
          test ! -e out/drivers/kernelsu/preinit/runner.elf.o || { echo 'ERROR: preinit runner object was built'; exit 1; }
          test ! -e out/drivers/kernelsu/preinit/blob.o || { echo 'ERROR: preinit blob.o was built'; exit 1; }
          # ntsync must be built in, not silently dropped by Kconfig deps
          test -f out/drivers/misc/ntsync.o || { echo 'ERROR: ntsync.o not built'; exit 1; }
          # POC Selector is #included into fair.o, so fair.o is the only
          # object that proves it compiled into the image.
          test -f out/kernel/sched/fair.o || { echo 'ERROR: fair.o not built'; exit 1; }
          # Cambyses must have really reached the image, not just be present
          # in the source: the late_initcall banner is the only artifact in
          # fair.o that proves the code compiled in rather than being
          # #ifdef'd or dropped by a config dependency.
          strings out/kernel/sched/fair.o | grep -q 'Cambyses CFS Load Balancer modification' || { echo 'ERROR: Cambyses not compiled into fair.o'; exit 1; }
          # LZ4KD: the crypto algorithm must really be built, not just =y in
          # .config, or "lz4kdr" never reaches comp_algorithm.
          test -f out/crypto/lz4kdr.o || { echo 'ERROR: lz4kdr.o not built'; exit 1; }
          # ADIOS must be the built-in default scheduler: IOSCHED_ADIOS can be
          # =y while DEFAULT_ADIOS is unset (choice default is CFQ), which
          # compiles adios-iosched.o but never selects it at boot.
          test -f out/block/adios-iosched.o || { echo 'ERROR: adios-iosched.o not built'; exit 1; }
          # Reflex must be built in, not a module: the AK3 zip ships only
          # Image.gz-dtb, so a .ko would never reach the device.
          test -f out/drivers/cpufreq/cpufreq_reflex.o || { echo 'ERROR: cpufreq_reflex.o not built'; exit 1; }
          test ! -f out/drivers/cpufreq/cpufreq_reflex.ko || { echo 'ERROR: reflex built as a module, would never be flashed'; exit 1; }
          # BBRv3 must have really compiled into the image, not just been set
          # in .config: TCP_CONG_BBR3 hides behind TCP_CONG_ADVANCED, and a
          # dependency miss leaves =y in .config with no object.
          test -f out/net/ipv4/tcp_bbr3.o || { echo 'ERROR: tcp_bbr3.o not built'; exit 1; }
          test -f out/net/ipv4/tcp_plb.o || { echo 'ERROR: tcp_plb.o not built'; exit 1; }
          # The built-in tcp_bbr3.o must be inside net/built-in.o; a stray .ko
          # would never be flashed (AK3 ships only Image.gz-dtb).
          test ! -f out/net/ipv4/tcp_bbr3.ko || { echo 'ERROR: tcp_bbr3 built as a module, would never be flashed'; exit 1; }
          mkdir -p artifacts
          # %q: values get shell-quoted, because BMGR contains spaces and commas
          # and the file is sourced later (unquoted, `Official,` ran as a command).
          {
            printf 'BCODE=%q\n' "$(sed -n 's/^-- BakaSU version code:[[:space:]]*//p' build-${{ matrix.device }}.log | head -n1)"
            printf 'BNAME=%q\n' "$(sed -n 's/^-- BakaSU version name:[[:space:]]*//p' build-${{ matrix.device }}.log | head -n1)"
            printf 'BMGR=%q\n' "$(sed -n 's/^-- Supported Managers:[[:space:]]*//p' build-${{ matrix.device }}.log | head -n1)"
          } > artifacts/BKSU_VERSION.txt
          cat artifacts/BKSU_VERSION.txt

      - name: Fetch AnyKernel3
        run: |
          # Pin, never HEAD. See AK3_COMMIT above for why.
          rm -rf AnyKernel3
          git clone "$AK3_SOURCE" AnyKernel3
          git -C AnyKernel3 checkout --detach "$AK3_COMMIT"
          git -C AnyKernel3 log -1 --format="AnyKernel3 pinned at %h %s"
          # Remove images folder - we want Image.gz-dtb at zip root
          rm -rf AnyKernel3/images
          # Gate the exit-code handling in split_boot().
          #
          # The regression was a one-line rewrite from
          #     case $? in 1) splitfail=1;; 2) touch chromeos;; esac;
          # to
          #     [ $? == 1 ] && splitfail=1;
          # A failing `[` test exits 1, so the line after it reads a
          # stale 1 and aborts on a successful unpack. Asserting the
          # `case` form is present is what makes the pin meaningful:
          # if AK3_COMMIT is ever bumped or the pin dropped, this fails
          # the build instead of shipping another unflashable zip.
          grep -q 'splitfail=1;;' AnyKernel3/tools/ak3-core.sh \
            || { echo 'ERROR: AK3 split_boot() lost its safe exit-code handling (bb45b02 regression); update AK3_COMMIT'; exit 1; }

      - name: Build + pack 3 variants (NSE / SE / DYNAMIC)
        run: |
          set -eu
          # The kernel Image was already built in the previous step and is NOT
          # variant-specific: the only difference is the fstab node inside the
          # DTB, so each variant just recompiles the dtbs and repacks the zip.
          KMAKE="make -j$(nproc) ARCH=$KERNEL_ARCH CC=$PWD/tc/proton-clang/bin/clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$PWD/tc/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$PWD/tc/gcc-32/bin/arm-linux-androideabi- O=out"
          mkdir -p artifacts
          # The loop value stays lowercase because it is the dt-variants/<name>.dtsi
          # path; VARIANT_UC is the label users see (zip name, installer UI).
          for VARIANT in nse se dynamic; do
            VARIANT_UC=$(echo "$VARIANT" | tr '[:lower:]' '[:upper:]')
            echo "::group::${{ matrix.device }} / $VARIANT_UC"
            # The single variant switch: which fstab fragment
            # sdm845-xiaomi-common.dtsi includes (shared by all six Xiaomi
            # SDM845 devices).
            printf '#include "dt-variants/%s.dtsi"\n' "$VARIANT" > arch/arm64/boot/dts/qcom/xiaomi-dt-variant.dtsi
            # Drop the old dtbs: kbuild only rebuilds missing or changed
            # targets, and each variant's DTB must really be recompiled from the
            # fragment above -- not reused from the previous iteration.
            rm -f out/arch/arm64/boot/dts/qcom/${{ matrix.device }}*.dtb out/arch/arm64/boot/dts/qcom/sdm845*.dtb
            $KMAKE dtbs
            rm -rf out/Image.gz-dtb out/img
            mkdir -p out/Image.gz-dtb out/img
            cp out/arch/arm64/boot/dts/qcom/${{ matrix.device }}*.dtb out/Image.gz-dtb/ 2>/dev/null || true
            cp out/arch/arm64/boot/dts/qcom/sdm845*.dtb out/Image.gz-dtb/ 2>/dev/null || true
            cat out/Image.gz/Image.gz out/Image.gz-dtb/*.dtb > out/Image.gz-dtb/Image.gz-dtb
            ls -la out/Image.gz-dtb/Image.gz-dtb
            # Fails if the DTB carries an fstab that does not match this variant.
            python3 scripts/check_device_dtb.py out/Image.gz-dtb/Image.gz-dtb ${{ matrix.device }} "$VARIANT"
            # The AnyKernel3 tree is left clean; every edit happens in out/img so
            # the next variant cannot inherit the previous variant's sed edits.
            cp -r AnyKernel3/* out/img/
            cp anykernel/anykernel.sh out/img/anykernel.sh
            sed -i "s/__VARIANT__/${VARIANT_UC}/g" out/img/anykernel.sh
            # Same mechanism for the build date shown in the flash banner:
            # the date the image was built, not the date it was flashed.
            # UTC so the value does not depend on the runner's timezone.
            sed -i "s|__BUILD_DATE__|$(date -u +%d.%m.%Y)|g" out/img/anykernel.sh
            # if/then, not `grep -q ... && { }`: under `bash -e` the && form
            # returns non-zero when the placeholder is correctly gone.
            if grep -q "__BUILD_DATE__" out/img/anykernel.sh; then echo "ERROR: __BUILD_DATE__ not substituted"; exit 1; fi
            # kernel.string must stay shell-parseable: anykernel.sh is SOURCED by
            # update-binary, so parentheses in the value are a parse error
            # ("syntax error near unexpected token `('") and every flash dies with
            # TWRP ERROR 1 before the script runs. Dash only, no brackets.
            sed -i "s/kernel.string=.*/kernel.string=BakaSU Kernel ${BRANCH} for ${{ matrix.device }} - ${VARIANT_UC}/" out/img/anykernel.sh
            sed -i "s|## Kernel xiaomi sdm845.*|## Kernel xiaomi sdm845 (CAF 4.9.337) by RanggaWbp|" out/img/anykernel.sh
            sed -i "s|## Features:.*|## Features: BakaSU + SUSFS + NoMount + BBG + DroidSpaces + ReKernel + NTSYNC + BORE + ADIOS + MGLRU + LZ4 + LZ4KD + BBRv3 + POC Selector + Cambyses + Reflex|" out/img/anykernel.sh
            # Same class of failure as above, caught before zipping: TWRP only
            # reports "Updater process ended with ERROR: 1" with no line number,
            # so a syntax error has to be caught here instead of in the field.
            sh -n out/img/anykernel.sh || { echo "::error::anykernel.sh fails sh -n after templating"; exit 1; }
            cp out/Image.gz-dtb/Image.gz-dtb out/img/Image.gz-dtb
            ZIP_NAME="BakaSU-${{ matrix.device }}-${VARIANT_UC}-v${RUN_ID}-$(date +%Y%m%d).zip"
            ( cd out/img && zip -r9 "$GITHUB_WORKSPACE/artifacts/$ZIP_NAME" . )
            unzip -l "artifacts/$ZIP_NAME" | tail -n 12
            echo "::endgroup::"
          done
          ls -la artifacts/
      - name: Collect build metadata
        run: |
          set -eu
          KVER=$(sed -n 's/^CONFIG_LOCALVERSION=//p' out/.config | tr -d '"')
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          git log --oneline -15 > artifacts/CHANGELOG.txt
          # shellcheck disable=SC1091
          . artifacts/BKSU_VERSION.txt
          {
            echo ""
            echo "Model: ${{ matrix.model }} (${{ matrix.device }})"
            echo "Branch: $BRANCH"
            echo "Run: $RUN_ID"
            echo "BakaSU: $BNAME (code $BCODE)"
            echo "Supported: $BMGR"
            echo "Kernel: CAF 4.9.337 $KVER"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> artifacts/CHANGELOG.txt

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: bakasu-${{ matrix.device }}
          # Only the flashable zip and its short changelog. Uploading out/ here
          # pushed ~2.6 GB of object files and vmlinux per device for no reason.
          path: |
            artifacts/*.zip
            artifacts/CHANGELOG.txt
            artifacts/BKSU_VERSION.txt
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release (all 18 zips)
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bakasu-*
          merge-multiple: true

      - name: Verify all 18 zips present
        run: |
          set -eu
          # 6 devices x 3 variants (NSE / SE / DYNAMIC).
          n=$(ls artifacts/BakaSU-*.zip 2>/dev/null | wc -l)
          ls -la artifacts/BakaSU-*.zip
          [ "$n" -eq 18 ] || { echo "::error::expected 18 zips, found $n"; exit 1; }
          for d in beryllium dipper equuleus perseus polaris ursa; do
            for v in NSE SE DYNAMIC; do
              ls artifacts/BakaSU-$d-$v-*.zip >/dev/null 2>&1 \
                || { echo "::error::missing zip for $d / $v"; exit 1; }
            done
          done

      - name: Determine tag
        id: tag
        run: |
          set -eu
          TAG='${{ github.event.inputs.release_tag }}'
          [ -n "$TAG" ] || TAG="v${{ github.run_number }}-$(date -u +%d%m%Y)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve BakaSU version
        id: bksu
        run: |
          set -eu
          # Every matrix job builds the same pinned BakaSU submodule, so any one
          # of the uploaded BKSU_VERSION.txt files carries the truth.
          f=$(ls artifacts/BKSU_VERSION.txt 2>/dev/null | head -n1)
          [ -n "$f" ] || { echo "::error::BKSU_VERSION.txt missing from artifacts"; exit 1; }
          . "$f"
          echo "name=$BNAME" >> "$GITHUB_OUTPUT"
          echo "code=$BCODE" >> "$GITHUB_OUTPUT"
          echo "managers=$BMGR" >> "$GITHUB_OUTPUT"
          echo "BakaSU $BNAME (code $BCODE); managers: $BMGR"

      - name: Build release notes
        run: |
          set -eu
          {
            echo "## BakaSU - Xiaomi SDM845 (CAF 4.9.337)"
            echo
            echo "**BakaSU version:** \`${{ steps.bksu.outputs.name }}\` (version code \`${{ steps.bksu.outputs.code }}\`)"
            echo
            echo "**Supported managers:** ${{ steps.bksu.outputs.managers }}"
            echo
            echo "Built from \`${{ github.ref_name }}\` @ \`${{ github.sha }}\` on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "| Codename | Device | Variant | Zip |"
            echo "|---|---|---|---|"
            while IFS='|' read -r d m; do
              for v in NSE SE DYNAMIC; do
                f=$(ls artifacts/BakaSU-$d-$v-*.zip 2>/dev/null | head -n1)
                [ -n "$f" ] || { echo "::error::zip $d/$v hilang"; exit 1; }
                echo "| \`$d\` | $m | \`$v\` | \`$(basename "$f")\` |"
              done
            done <<'DEV'
          beryllium|POCOPHONE F1
          dipper|Xiaomi Mi 8
          equuleus|Xiaomi Mi 8 Pro (UD)
          perseus|Xiaomi MIX 3
          polaris|Xiaomi MIX 2S
          ursa|Xiaomi Mi 8 Explorer Edition
          DEV
            echo
            echo "### Features"
            echo "- **BakaSU** (ReSukiSU) KernelSU integration"
            echo "- **SUSFS** v2.3.0"
            echo "- **NoMount** (maxsteeel/nomount)"
            echo "- **Baseband-guard** (vc-teahouse/Baseband-guard)"
            echo "- **ReKernel** tombstone netlink server (Sakion-Team: a Netlink endpoint tombstone apps talk to, so native crashes are reported with fuller detail)"
            echo "- **DroidSpaces** container support"
            echo "- **NTSYNC** (/dev/ntsync) NT sync primitives for Wine/Proton"
            echo "- **BORE** CPU scheduler (EEVDF burst-aware vruntime)"
            echo "- **ADIOS** I/O scheduler (adaptive deadline)"
            echo "- **MGLRU** Multi-Gen LRU page reclaim (MGLRU v5 backport)"
            echo "- **LZ4** zram compressor (lz4 default, synced to upstream lib/lz4)"
            echo "- **LZ4KD** zram compressor v1.3 (Huawei LZ4KD derivative, **selectable, not the default** -- switch with \`echo lz4kdr > /sys/block/zram0/comp_algorithm\` before init, or from Franco Kernel Manager)"
            echo "- **BBRv3** TCP congestion control (\`bbr3\`, **active by default**, coexists with \`bbr\` v1) + **PLB** load balancing"
            echo "- **POC Selector** v2.6.3 (Piece-Of-Cake idle CPU selector, capacity-class gated so it stays inside the target's cluster on big.LITTLE)"
            echo "- **Reflex** cpufreq governor v0.4.0 (schedutil + measured fast path for rising load, **active by default**)"
            echo "- **Cambyses** CFS load balancer v0.6.0 (Masahito Suzuki: migration candidates compared directly against the remaining imbalance instead of halved, and a scan that admits nothing concedes to the cheapest overshoot so balancing still makes progress; **both LB_STRICT_BUDGET and LB_ROTATE_BLOCK active**)"
            echo
            echo "### BBRv3"
            echo "\`bbr3\` is the default congestion control in this image (\`CONFIG_DEFAULT_TCP_CONG=\"bbr3\"\`), so it is live from boot for every new connection — no sysctl needed."
            echo
            echo '```sh'
            echo "# verify"
            echo "sysctl net.ipv4.tcp_congestion_control   # -> bbr3"
            echo "sysctl net.ipv4.tcp_available_congestion_control"
            echo "# revert to cubic at runtime (no reflash)"
            echo "sysctl -w net.ipv4.tcp_congestion_control=cubic"
            echo '```'
            echo "BBRv3 paces internally, so no \`fq\` qdisc is required. \`bbr\` v1 and \`cubic\` remain selectable."
            echo
            echo "### Choosing a variant (required)"
            echo "The kernel image is identical across the three variants. The only difference is the fstab node inside the DTB: \`init\` uses the fstab from the DTB when that node is present, and falls back to the rom's own fstab when it is absent. The variant therefore decides where the kernel looks for /system, /system_ext and /vendor."
            echo
            echo "| Variant | Meaning | Use for |"
            echo "|---|---|---|"
            echo "| \`NSE\` | Non-System-Ext | Android 10/11 roms with no separate /system_ext partition |"
            echo "| \`SE\` | System-Ext | Android 10/11 roms with /system_ext (taken from the \`cust\` partition) |"
            echo "| \`DYNAMIC\` | Dynamic partition | Android 12+ roms (super/logical), including 12+ roms that are SE or NSE |"
            echo
            echo "If unsure, check your rom:"
            echo
            echo '```sh'
            echo "adb shell 'cat /vendor/etc/fstab.qcom | grep -E \"system|logical\"'"
            echo '```'
            echo
            echo "No laptop? Run this on the phone itself - Termux, or any terminal emulator app:"
            echo
            echo '```sh'
            echo "cat /vendor/etc/fstab.qcom | grep -E 'system|logical'"
            echo "# if that file does not exist, list what the rom ships"
            echo "ls /vendor/etc/fstab*"
            echo "# if the terminal app runs as shell and the file is unreadable"
            echo "su -c 'cat /vendor/etc/fstab.qcom' | grep -E 'system|logical'"
            echo '```'
            echo "If \`/system\` shows up with \`first_stage_mount\`, the rom ships its own fstab (Android 12+) — use \`DYNAMIC\`. If the \`/system\`/\`/vendor\` entries are only \`recoveryonly\` or missing entirely, the rom is Android 10/11: use \`SE\` when it has /system_ext, \`NSE\` when it does not."
            echo
            echo "> Wrong variant = boot failure: the kernel waits for a partition that does not exist, or mounts a static partition while the content actually lives inside \`super\`."
            echo
            echo "### Install"
            echo "1. Flash the zip matching your codename + variant via TWRP / OrangeFox."
            echo "2. Wipe cache + dalvik-cache (recommended)."
            echo "3. Reboot."
            echo
            echo "> Toolchain: ProtonClang (clang-13) + AOSP GCC 4.9 binutils. Android 10-15 (10/11 via the \`NSE\`/\`SE\` variants, 12+ via \`DYNAMIC\`)."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: BakaSU ${{ steps.tag.outputs.tag }} · ${{ steps.bksu.outputs.name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true
          files: artifacts/BakaSU-*.zip
