name: LawRun Build (ReSukiSU + SUSFS + NoMount + BBG + Re:Kernel)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (empty = auto: v<run_number>-<DDMMYYYY>)"
        required: false
        type: string
  push:
    branches:
      - resukisu-susfs-v4.2.0

permissions:
  contents: write

concurrency:
  group: lawrun-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---- Toolchain (pinned; do NOT switch to "latest") ---------------------
  # Hybrid clang + GCC, which is what this tree actually needs:
  #
  #  * CC is ProtonClang. Its bundled clang-13 is era-matched to this CAF
  #    4.9.337 tree. Newer LLVM (llvmorg-19+) breaks arm64 vdso asm and
  #    crypto inline asm here.
  #  * CROSS_COMPILE points at AOSP's GCC 4.9 prebuilts, NOT ProtonClang's
  #    binutils. ProtonClang's bundled ld/binutils are too old for
  #    ubuntu's glibc (.relr.dyn), so the aarch64 linker must come from GCC.
  #    This is why clang is called by absolute path and is not put on PATH
  #    wholesale.
  #  * CLANG_TRIPLE must be the GNU triple aarch64-linux-gnu- (see
  #    build.config.aarch64); a bare aarch64 triple breaks CAF's tooling.
  CLANG_REPO: https://github.com/kdrag0n/proton-clang
  GCC_64_SOURCE: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
  GCC_64_BRANCH: android12L-release
  GCC_32_SOURCE: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
  GCC_32_BRANCH: android12L-release
  AK3_SOURCE: https://github.com/osm0sis/AnyKernel3.git
  KERNEL_ARCH: arm64

jobs:
  build:
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: beryllium
            defconfig: beryllium_defconfig
          - device: dipper
            defconfig: dipper_defconfig
          - device: equuleus
            defconfig: equuleus_defconfig
          - device: perseus
            defconfig: perseus_defconfig
          - device: polaris
            defconfig: polaris_defconfig
          - device: ursa
            defconfig: ursa_defconfig

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio curl flex \
            git libssl-dev libelf-dev make python3 rsync zip zstd

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # ---------- backports ----------
      # The three submodules are kept pristine at their pinned upstream
      # commits. The 4.9 fixes live as patch files in the kernel tree so
      # they survive a submodule bump and need no submodule fork.
      - name: Apply 4.9 backport patches
        run: |
          set -eu
          apply_if_needed() {
            p="$1"; d="${2:-.}"
            if git -C "$d" apply --check -R "$p" 2>/dev/null; then
              echo "already applied: $p"
            else
              git -C "$d" apply -v "$p"
            fi
          }
          # Re:Kernel lives directly in the tree.
          apply_if_needed patches/backport/0002-rekernel-linux-4.9-cgroup-task-frozen.patch .
          # Baseband-guard is a submodule reached through the
          # security/baseband-guard symlink; git refuses to write through a
          # symlink, so apply it inside the submodule.
          apply_if_needed ../patches/backport/0001-baseband-guard-linux-4.9-no-blk-h.patch Baseband-guard
          grep -q 'KERNEL_VERSION(5, 11, 0)' Baseband-guard/kernel_compat.h \
            && echo "BBG backport in place"

      - name: Verify feature patches are present
        run: |
          set -eux
          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          test -f fs/susfs.c
          test -f drivers/net/rekernel/rekernel.c
          for f in security/baseband-guard/kernel_compat.h; do test -f "$f"; done
          echo "All patch artefacts present"

      # ---------- toolchain ----------
      - name: Cache toolchain
        id: tc-cache
        uses: actions/cache@v4
        with:
          path: |
            tc/clang
            tc/gcc-64
            tc/gcc-32
          key: tc-protonclang-gcc4.9-v2

      - name: Fetch ProtonClang
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p tc
          git clone --depth 1 "$CLANG_REPO" tc/clang
          test -x tc/clang/bin/clang
          tc/clang/bin/clang --version | head -n2

      - name: Fetch AOSP GCC 4.9 (aarch64 + arm)
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 -b "$GCC_64_BRANCH" "$GCC_64_SOURCE" tc/gcc-64
          git clone --depth 1 -b "$GCC_32_BRANCH" "$GCC_32_SOURCE" tc/gcc-32
          tc/gcc-64/bin/aarch64-linux-android-gcc --version | head -n1

      - name: Show toolchain
        run: |
          tc/clang/bin/clang --version | head -n1
          tc/gcc-64/bin/aarch64-linux-android-gcc --version | head -n1

      - name: Cache AnyKernel3
        id: ak-cache
        uses: actions/cache@v4
        with:
          path: tc/AnyKernel3
          key: anykernel3-v3

      - name: Fetch AnyKernel3
        if: steps.ak-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 "$AK3_SOURCE" tc/AnyKernel3

      # ---------- build ----------
      - name: Build kernel
        run: |
          set -o pipefail
          # NOTE: do not pass this via `env:` -- Actions does not run shell
          # substitution there, so "-j$(nproc)" would arrive literally and
          # make would print its usage and exit 2.
          MAKE_FLAGS="-j$(nproc)"
          # ARCH must be passed to make explicitly. Without it the top
          # Makefile falls back to x86 and defconfig lookup fails with
          # "Can't find default configuration arch/x86/configs/...".
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/tc/gcc-64/bin:$GITHUB_WORKSPACE/tc/gcc-32/bin:/usr/bin:/bin:$PATH"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC="$GITHUB_WORKSPACE/tc/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GITHUB_WORKSPACE/tc/gcc-64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/tc/gcc-32/bin/arm-linux-androideabi-"

          make $MAKE_FLAGS ARCH=$KERNEL_ARCH "${{ matrix.defconfig }}" 2>&1 | tee build-${{ matrix.device }}.log

          # Fail loudly if any feature silently dropped out of .config.
          # KSU_SUSFS in particular disappears when THREAD_INFO_IN_TASK is
          # unset, because of its "depends on" in KernelSU/kernel/Kconfig.
          for sym in KSU KSU_SUSFS THREAD_INFO_IN_TASK NOMOUNT BBG REKERNEL; do
            grep -q "CONFIG_${sym}=y" .config || { echo "::error::CONFIG_${sym} missing from .config"; exit 1; }
          done
          echo "All feature configs present in .config"

          make $MAKE_FLAGS ARCH=$KERNEL_ARCH 2>&1 | tee -a build-${{ matrix.device }}.log

      - name: Verify feature symbols landed in the built Image
        run: |
          set -eu
          IMG=arch/arm64/boot/Image
          test -f "$IMG"
          nm -a "$IMG" > symbols.txt 2>/dev/null || true
          fail=0
          check() {
            if grep -q "$1" symbols.txt; then echo "  OK   $1"; else echo "  MISS $1"; fail=1; fi
          }
          check susfs_is_sdcard_android_data_not_decrypted
          check susfs_is_current_proc_no_su
          check ksu_handle_execveat
          check ksu_handle_sys_reboot
          check nomount_hijacked_lookup
          check bb_file_permission
          check rekernel_report
          exit $fail

      - name: Report feature-related warnings
        if: always()
        run: |
          grep -iE "(susfs|nomount|baseband_guard|rekernel|kernelsu).*(warning|error)" \
            "build-${{ matrix.device }}.log" | head -n 40 || echo "No feature-related warnings."

      # ---------- package ----------
      - name: Package with AnyKernel3
        run: |
          set -eux
          AK3="$GITHUB_WORKSPACE/tc/AnyKernel3"
          ZIP_NAME="LawRun-${{ matrix.device }}-$(date +%d%m%Y).zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          cd "$AK3"
          rm -rf .git .github
          cp "$GITHUB_WORKSPACE/arch/arm64/boot/Image" .
          # anykernel.sh is committed in the repo; it cannot be inlined as an
          # indented heredoc inside a YAML block scalar (bash would emit the
          # block indentation into the script and AK3 would fail to parse it).
          cp "$GITHUB_WORKSPACE/anykernel/anykernel.sh" .
          head -n1 anykernel.sh

          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" ./* -x .git -x .github -x README.md
          cd "$GITHUB_WORKSPACE"
          test -f "$ZIP_NAME"
          unzip -l "$ZIP_NAME" | grep -E "Image|anykernel.sh"

      - name: Upload build artifact (internal hand-off only)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.device }}
          path: |
            LawRun-${{ matrix.device }}-*.zip
            build-${{ matrix.device }}.log
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish single release with all 6 zips
    needs: build
    runs-on: ubuntu-22.04
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: kernel-*
          merge-multiple: true

      - name: Verify all 6 zips present
        run: |
          set -eu
          n=$(ls artifacts/LawRun-*.zip 2>/dev/null | wc -l)
          echo "Found $n zips:"
          ls -la artifacts/LawRun-*.zip
          if [ "$n" -ne 6 ]; then
            echo "::error::Expected 6 zips, found $n"
            exit 1
          fi

      - name: Determine release tag
        id: tag
        run: |
          set -eu
          TAG='${{ inputs.release_tag }}'
          if [ -z "$TAG" ]; then
            TAG="v${{ github.run_number }}-$(date +%d%m%Y)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          {
            echo "## LawRun — Xiaomi SDM845 (CAF 4.9.337)"
            echo
            echo "Built from \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`."
            echo
            echo "| Codename | Zip |"
            echo "|---|---|"
            for d in beryllium dipper equuleus perseus polaris ursa; do
              f=$(ls artifacts/LawRun-$d-*.zip 2>/dev/null | head -n1)
              [ -n "$f" ] && echo "| \`$d\` | \`$(basename "$f")\` |"
            done
            echo
            echo "### Included"
            echo "- ReSukiSU v4.2.0-rc3 (SUSFS inline-hook method)"
            echo "- SUSFS v2.3.0"
            echo "- NoMount (maxsteeel/nomount)"
            echo "- Baseband-guard (vc-teahouse/Baseband-guard)"
            echo "- Re:Kernel"
            echo
            echo "Toolchain: ProtonClang (clang-13) + AOSP GCC 4.9."
            echo
            echo "> Flash with AnyKernel3. BBG does not block \`boot\`/\`recovery\`, so normal flashing works."
          } > artifacts/NOTES.md

      - name: Publish to one GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: LawRun ${{ steps.tag.outputs.TAG }}
          body_path: artifacts/NOTES.md
          draft: false
          prerelease: true
          files: |
            artifacts/LawRun-beryllium-*.zip
            artifacts/LawRun-dipper-*.zip
            artifacts/LawRun-equuleus-*.zip
            artifacts/LawRun-perseus-*.zip
            artifacts/LawRun-polaris-*.zip
            artifacts/LawRun-ursa-*.zip
